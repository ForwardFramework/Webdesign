# Netlify deployment for topdogexteriors.com

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# The lead router, used only when src/data/forms.ts sets leadDelivery =
# 'function'. In the default 'netlify-forms' mode nothing posts to /api/lead and
# this rule never fires. `config.path` inside lead.mts already claims the path;
# this redirect is the belt-and-braces version for older Netlify runtimes.
#
# Headers below are mirrored in public/_headers, which is what carries them on a
# drag-and-drop deploy (no build runs, so this file is only read for redirects
# and headers at the deploy root). Change both together.
[[redirects]]
  from = "/api/lead"
  to = "/.netlify/functions/lead"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Fingerprinted build output is immutable — cache it hard.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
