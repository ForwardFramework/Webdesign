<!doctype html><html><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Archivo Black';src:url('../assets/fonts/archivo-black-latin.woff2') format('woff2');font-weight:400}
  @font-face{font-family:'Inter';src:url('../assets/fonts/inter-latin-var.woff2') format('woff2');font-weight:100 900}
  *{margin:0;box-sizing:border-box}
  html{height:630px;background:#07080A}
  body{width:1200px;height:630px;overflow:hidden;font-family:Inter,system-ui,sans-serif;
    background:radial-gradient(900px 520px at 80% -10%,rgba(242,106,27,.30),transparent 62%),
               radial-gradient(700px 420px at 0% 110%,rgba(127,194,232,.10),transparent 60%),
               linear-gradient(160deg,#07080A,#0B0D10 55%,#15181E);
    color:#fff;position:relative}
  .grid{position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(760px 460px at 46% 40%,#000,transparent 78%)}
  .in{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 74px;gap:22px}
  .lock{display:flex;align-items:center;gap:18px}
  .lock img{height:88px;width:auto}
  .fb{display:none;flex-direction:column;line-height:1}
  .fb b{font-family:'Archivo Black';font-size:40px;letter-spacing:-.01em}
  .fb span{font-size:16px;letter-spacing:.42em;color:#F26A1B;font-weight:800;margin-top:6px}
  h1{font-family:'Archivo Black';font-size:62px;line-height:1.06;letter-spacing:-.02em}
  h1 em{font-style:normal;color:#FF8A2B}
  p{font-size:23px;color:#B0B9C5;max-width:48ch;line-height:1.45}
  .row{display:flex;align-items:center;gap:18px;margin-top:6px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:10px;padding:13px 24px;border-radius:100px;
    font-weight:800;font-size:22px;background:linear-gradient(180deg,#FF8A2B,#C24608);box-shadow:0 12px 34px -12px rgba(242,106,27,.6)}
  .pill.ghost{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.2);color:#E7EBF0}
  .stars{color:#FF8A2B;font-size:24px;letter-spacing:3px}
  .bar{position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(90deg,#C24608,#FF8A2B,#C24608)}
</style></head><body>
<div class="grid"></div>
<div class="in">
  <div class="lock">
    <img src="../assets/img/logo.png" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <span class="fb"><b>ROUGHNECK</b><span>ROOFING</span></span>
  </div>
  <h1><em>Roofs Built Tough.</em><br>Service Done Right.</h1>
  <p>Roof replacement, repair &amp; storm damage across Pittsburgh, PA and surrounding counties.</p>
  <div class="row">
    <span class="pill">878-226-0855</span>
    <span class="pill ghost">Free Inspection</span>
    <span class="stars">★★★★★ <span style="color:#E7EBF0;font-size:20px;font-weight:700">5.0 · 9 reviews</span></span>
  </div>
</div>
<div class="bar"></div>
</body></html>
