<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" role="img" aria-label="Yasse's Cleaning — Sparkling Spaces, Happy Places">
  <title>Yasse's Cleaning</title>
  <defs>
    <style>
      .navy{fill:#16305C}
      .green{fill:#6AB023}
      .wordmark{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:700}
      .sub{font-family:"Inter",Helvetica,Arial,sans-serif;font-weight:600}
    </style>
  </defs>

  <!-- Sparkles -->
  <g class="navy">
    <path d="M424 34c2.6 12.4 6.6 16.4 19 19-12.4 2.6-16.4 6.6-19 19-2.6-12.4-6.6-16.4-19-19 12.4-2.6 16.4-6.6 19-19z"/>
    <path d="M462 74c1.9 9 4.8 11.9 13.8 13.8-9 1.9-11.9 4.8-13.8 13.8-1.9-9-4.8-11.9-13.8-13.8 9-1.9 11.9-4.8 13.8-13.8z"/>
    <path d="M404 78c1.4 6.6 3.5 8.7 10.1 10.1-6.6 1.4-8.7 3.5-10.1 10.1-1.4-6.6-3.5-8.7-10.1-10.1 6.6-1.4 8.7-3.5 10.1-10.1z"/>
  </g>

  <!-- House: roof, body, chimney -->
  <g class="navy">
    <path d="M310 32 214 116h30v72h132v-72h30L310 32zm0 26 62 54v62h-24v-40h-76v40h-24v-62l62-54z"/>
    <rect x="336" y="52" width="20" height="34" rx="3"/>
    <!-- window panes -->
    <rect x="286" y="106" width="48" height="48" rx="4"/>
    <g fill="#fff">
      <rect x="292" y="112" width="16" height="16"/>
      <rect x="312" y="112" width="16" height="16"/>
      <rect x="292" y="132" width="16" height="16"/>
      <rect x="312" y="132" width="16" height="16"/>
    </g>
  </g>

  <!-- Green sparkle swoosh under the house -->
  <path class="green" d="M118 196c58 34 118 48 176 46s112-20 158-46c-38 40-96 66-160 68s-124-22-174-68z"/>
  <path class="green" d="M150 214c-16-4-30-12-40-24 26 12 52 20 78 24-13 2-26 2-38 0z" opacity=".85"/>

  <!-- Leaves (right side of swoosh) -->
  <g class="green">
    <path d="M470 168c-30 2-52 16-58 40 24 6 44-2 54-20 5-9 6-15 4-20z"/>
    <path d="M498 196c-24 8-38 24-38 46 21-1 36-12 40-29 2-8 1-13-2-17z" opacity=".9"/>
    <path d="M414 214c22-16 44-26 66-30-24 10-44 24-60 42l-6-12z" fill="#4d8419" opacity=".55"/>
  </g>

  <!-- Wordmark -->
  <text class="wordmark navy" x="310" y="300" font-size="104" letter-spacing="2" text-anchor="middle">YASSE’S</text>
  <text class="wordmark green" x="310" y="352" font-size="52" letter-spacing="14" text-anchor="middle">CLEANING</text>
  <text class="sub navy" x="310" y="384" font-size="21" letter-spacing="2.4" text-anchor="middle">SPARKLING SPACES, HAPPY PLACES</text>
</svg>
