<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="Mommy Made — Cleaned with care, given back with love">
  <title>Mommy Made</title>
  <defs>
    <style>
      .plum{fill:#5A2E41}
      .sage{fill:#6E9A5B}
      .rose{fill:#D98E82}
      .wordmark{font-family:"Fraunces","Playfair Display",Georgia,serif;font-weight:700}
      .hand{font-family:"Caveat","Segoe Script",cursive;font-weight:600}
    </style>
  </defs>

  <!-- Roof + home, with a heart where the family is -->
  <g class="plum">
    <path d="M320 40 214 128h26v18h160v-18h26L320 40zm0 27 68 57v4H252v-4l68-57z"/>
    <path d="M248 160v84a10 10 0 0 0 10 10h124a10 10 0 0 0 10-10v-84H248zm18 18h108v58H266v-58z"/>
  </g>
  <!-- heart inside the home -->
  <path class="rose" d="M320 228c-17-12-28-21-28-32a14 14 0 0 1 26-7 14 14 0 0 1 26 7c0 11-11 20-24 32z"/>

  <!-- Sage leaf sprigs either side -->
  <g class="sage">
    <path d="M196 214c-22-6-36-20-40-40 24 2 41 13 47 31 2 5 1 8-7 9z"/>
    <path d="M204 246c-24 1-42-8-52-26 23-5 42 0 52 16 3 5 3 8 0 10z" opacity=".85"/>
    <path d="M444 214c22-6 36-20 40-40-24 2-41 13-47 31-2 5-1 8 7 9z"/>
    <path d="M436 246c24 1 42-8 52-26-23-5-42 0-52 16-3 5-3 8 0 10z" opacity=".85"/>
  </g>

  <!-- Sparkles -->
  <g class="sage">
    <path d="M430 62c2.2 10.6 5.6 14 16.2 16.2-10.6 2.2-14 5.6-16.2 16.2-2.2-10.6-5.6-14-16.2-16.2 10.6-2.2 14-5.6 16.2-16.2z"/>
    <path d="M462 104c1.4 6.8 3.6 9 10.4 10.4-6.8 1.4-9 3.6-10.4 10.4-1.4-6.8-3.6-9-10.4-10.4 6.8-1.4 9-3.6 10.4-10.4z" opacity=".8"/>
  </g>

  <!-- Wordmark -->
  <text class="wordmark plum" x="320" y="318" font-size="76" letter-spacing="1" text-anchor="middle">Mommy Made</text>
  <text class="hand rose" x="320" y="358" font-size="32" text-anchor="middle">Cleaned with care, given back with love</text>
</svg>
