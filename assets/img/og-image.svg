<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Forward Framework — web design, AI consulting, automation and marketing">
  <!--
    Social card, 1200x630. textLength + lengthAdjust on every line because the
    brand faces are webfonts: a renderer without Jost falls back to a wider
    system sans and, before this, ran the subtitle off the right edge. Fixing
    the advance width makes the card identical everywhere it is rendered.
    assets/img/og-image.png is generated from this file — regenerate it after
    any edit here, since that is the file the meta tags point at.
  -->
  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect x="0" y="0" width="1200" height="5" fill="#A99A8C"/>
  <g transform="translate(96 118) scale(0.58)">
    <path fill="#A99A8C" d="M78 34 L198 34 L164 68 L112 68 L112 112 L174 112 L140 146 L112 146 L112 200 L78 166 Z"/>
    <path fill="#FFFFFF" d="M0 0 L120 0 L86 34 L34 34 L34 78 L96 78 L62 112 L34 112 L34 200 L0 166 Z"/>
  </g>
  <text x="96" y="330" fill="#FFFFFF" font-family="Jost, Futura, 'Century Gothic', Helvetica, Arial, sans-serif"
        font-size="60" font-weight="300" letter-spacing="12"
        textLength="960" lengthAdjust="spacingAndGlyphs">FORWARD FRAMEWORK</text>
  <text x="96" y="392" fill="#A99A8C" font-family="Jost, Futura, 'Century Gothic', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" letter-spacing="4"
        textLength="960" lengthAdjust="spacingAndGlyphs">WEB DESIGN · AI CONSULTING · AUTOMATION · MARKETING</text>
  <text x="96" y="478" fill="#EFEBE6" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="34" font-weight="400"
        textLength="880" lengthAdjust="spacingAndGlyphs">Websites, AI systems and campaigns engineered to compound revenue.</text>
  <text x="96" y="528" fill="#8B8681" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="400"
        textLength="640" lengthAdjust="spacingAndGlyphs">Get your free Growth Plan — no contracts, no retainers to start.</text>
  <rect x="96" y="566" width="120" height="2" fill="#A99A8C"/>
  <text x="96" y="600" fill="#8B8681" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400"
        textLength="470" lengthAdjust="spacingAndGlyphs">www.forward-framework.com · (412) 463-2126</text>
</svg>
