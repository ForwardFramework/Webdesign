# Netlify build settings for {{SITE_NAME}}.
# Committed to the repo so Netlify configures itself on first deploy —
# `netlify init` reads this and skips the build-settings prompts.

[build]
  publish = "public"
  # No build step for a static template. For a bundler, set e.g.:
  #   command = "npm run build"
  #   publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Fingerprinted assets can be cached hard; HTML must not be.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
