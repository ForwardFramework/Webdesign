<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="Urban Brother's Heating &amp; Air">
  <title>Urban Brother's Heating &amp; Air</title>
  <defs>
    <style>
      .u-red  { fill: #D91F26; }
      .u-ink  { fill: #0A0A0A; }
      .u-wht  { fill: #FFFFFF; }
      .u-disp { font-family: "Barlow Condensed","Arial Narrow",Impact,sans-serif; font-weight: 800; }
    </style>
    <clipPath id="ubPanel"><rect x="0" y="0" width="900" height="250" rx="4"/></clipPath>
  </defs>

  <g clip-path="url(#ubPanel)">
    <!-- white panel -->
    <rect width="900" height="250" class="u-wht"/>

    <!-- black lower band with the signature red swoosh above it -->
    <path class="u-red" d="M0 168 C 220 132, 520 130, 900 158 L900 250 L0 250 Z"/>
    <path class="u-ink" d="M0 182 C 220 146, 520 144, 900 172 L900 250 L0 250 Z"/>

    <!-- left star -->
    <path class="u-red" d="M62 62 l11.4 25.6 27.9 2.9 -20.8 18.8 5.8 27.5 -24.3 -14 -24.3 14 5.8 -27.5 -20.8 -18.8 27.9 -2.9 Z"
          stroke="#0A0A0A" stroke-width="4" stroke-linejoin="round"/>
    <!-- right star -->
    <path class="u-red" d="M838 62 l11.4 25.6 27.9 2.9 -20.8 18.8 5.8 27.5 -24.3 -14 -24.3 14 5.8 -27.5 -20.8 -18.8 27.9 -2.9 Z"
          stroke="#0A0A0A" stroke-width="4" stroke-linejoin="round"/>

    <!-- condenser-unit mark (stands in for the technician illustration) -->
    <g transform="translate(128 34)">
      <rect x="0" y="0" width="104" height="118" rx="8" class="u-ink"/>
      <rect x="9" y="9" width="86" height="100" rx="4" class="u-wht"/>
      <g class="u-ink">
        <rect x="15" y="16" width="74" height="7" rx="3"/>
        <rect x="15" y="30" width="74" height="7" rx="3"/>
        <rect x="15" y="44" width="74" height="7" rx="3"/>
        <rect x="15" y="58" width="74" height="7" rx="3"/>
        <rect x="15" y="72" width="74" height="7" rx="3"/>
        <rect x="15" y="86" width="74" height="7" rx="3"/>
      </g>
      <circle cx="52" cy="62" r="21" class="u-red"/>
      <path class="u-wht" d="M52 47 a15 15 0 0 1 13 22.5 l-6.5 -3.7 A7.5 7.5 0 0 0 52 54.5 Z"/>
      <path class="u-wht" d="M65 69.5 a15 15 0 0 1 -26 0 l6.5 -3.7 a7.5 7.5 0 0 0 13 0 Z"/>
      <path class="u-wht" d="M39 69.5 a15 15 0 0 1 13 -22.5 v7.5 a7.5 7.5 0 0 0 -6.5 11.3 Z"/>
    </g>

    <!-- wordmark -->
    <text x="262" y="96" class="u-disp u-red" font-size="94" letter-spacing="2"
          stroke="#0A0A0A" stroke-width="5" paint-order="stroke">URBAN</text>
    <text x="262" y="152" class="u-disp u-ink" font-size="62" letter-spacing="1">BROTHER'S</text>
    <text x="262" y="196" class="u-disp u-wht" font-size="42" font-style="italic" letter-spacing="1">HEATING &amp; AIR</text>

    <!-- phone lockup -->
    <text x="880" y="196" class="u-disp u-wht" font-size="40" text-anchor="end" letter-spacing="1">412-913-5291</text>
    <rect x="596" y="180" width="26" height="4" class="u-red"/>
  </g>
</svg>
