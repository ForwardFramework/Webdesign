    <polyline points="114,238 232,152 320,192 408,152 526,238" stroke="#1E5FD9" stroke-width="13"/>
    <!-- windows -->
    <g fill="#ffffff" stroke="none">
      <rect x="200" y="192" width="11" height="11" rx="1"/><rect x="215" y="192" width="11" height="11" rx="1"/>
      <rect x="200" y="207" width="11" height="11" rx="1"/><rect x="215" y="207" width="11" height="11" rx="1"/>
      <rect x="414" y="192" width="11" height="11" rx="1"/><rect x="429" y="192" width="11" height="11" rx="1"/>
