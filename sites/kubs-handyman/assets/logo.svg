      <rect x="176" y="74" width="176" height="30" rx="15"/>
      <rect x="340" y="48" width="78" height="82" rx="13"/>
      <path d="M418 48c40 2 72 17 84 37l-23 5c-12-16-35-24-61-26z"/>
      <path d="M418 130c40-2 72-17 84-37l-23-5c-12 16-35 24-61 26z"/>
