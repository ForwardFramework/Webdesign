    <rect x="248" y="416" width="20" height="6" rx="2"/><path d="M255 422h6l-3 22z"/>
    <rect x="310" y="416" width="20" height="6" rx="2"/><path d="M317 422h6l-3 22z"/>
    <rect x="372" y="416" width="20" height="6" rx="2"/><path d="M379 422h6l-3 22z"/>
