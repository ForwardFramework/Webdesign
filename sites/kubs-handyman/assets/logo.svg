  <!-- wordmark -->
  <g font-family="'Barlow Condensed','Arial Narrow',Haettenschweiler,'Helvetica Neue',Arial,sans-serif" font-weight="700" text-anchor="middle">
    <text x="320" y="298" font-size="44" fill="#ffffff" letter-spacing="4" textLength="524" lengthAdjust="spacingAndGlyphs">KUBS HANDY - MAN SERVICES</text>
    <text x="320" y="340" font-size="26" fill="#ffffff" letter-spacing="5" textLength="470" lengthAdjust="spacingAndGlyphs">VERSATILE WORK BUILT TO LAST</text>
