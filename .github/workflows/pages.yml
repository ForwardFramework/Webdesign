name: Deploy to GitHub Pages

# Netlify is the live host (see CLAUDE.md). This one is manual-only so it
# neither deploys nor reports failures on every push. Run it from the
# Actions tab if you want to publish here as well.
on:
  workflow_dispatch:

# Least privilege needed to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        # Reports base_path and base_url, and accounts for a custom domain
        # (CNAME) automatically. Note: `enablement: true` was tried and the
        # workflow token is not permitted to create the Pages site
        # ("Resource not accessible by integration"), so Pages must be switched
        # on once by hand — see DEPLOY.md.
        uses: actions/configure-pages@v5

      - name: Stage the site
        run: |
          python3 tools/build_pages.py \
            "${{ steps.pages.outputs.base_path }}" \
            "${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
