name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/forward-framework-website-qwe3cg
  workflow_dispatch:

# Least privilege needed to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      # Resolves base_path and base_url, and accounts for a custom domain
      # (CNAME) automatically — with one, base_path is empty and nothing is
      # rewritten.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Stage the site
        run: |
          python3 tools/build_pages.py \
            "${{ steps.pages.outputs.base_path }}" \
            "${{ steps.pages.outputs.base_url }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
