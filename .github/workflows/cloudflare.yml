name: Deploy to Cloudflare Pages

# Netlify is the live host (see CLAUDE.md). This one is manual-only so it
# neither deploys nor reports failures on every push. Run it from the
# Actions tab if you want to publish here as well.
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      # Strips .html from links, canonicals, sitemap and llms.txt, because
      # Cloudflare Pages serves extensionless and 308-redirects the .html form.
      - name: Build the Cloudflare bundle
        run: python3 tools/build_cloudflare.py

      - name: Check for credentials
        id: creds
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — bundle built but not deployed. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/cloudflare --project-name=forward-framework

      # Keeps the bundle downloadable from the run even before secrets exist.
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-bundle
          path: dist/cloudflare
