# Deploy the Pittsburgh Painting site to Cloudflare Pages on every push.
#
# One-time setup (see pittsburgh-painting/README.md → Deploying):
#   1. Cloudflare → My Profile → API Tokens → Create Token → "Edit Cloudflare Workers"
#      template, or a custom token with the Account ▸ Cloudflare Pages ▸ Edit permission.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions, add:
#        CLOUDFLARE_API_TOKEN
#        CLOUDFLARE_ACCOUNT_ID   (Cloudflare dashboard → Workers & Pages → right-hand sidebar)
#
# After that, pushing to this repo deploys. Pushing `main` publishes production;
# any other branch gets its own preview URL. "Run workflow" on the Actions tab
# can force a branch out to production.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: ['**']
    paths:
      - 'pittsburgh-painting/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
    inputs:
      production:
        description: 'Publish as production (rather than a preview URL)'
        type: boolean
        default: false

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_NAME: pittsburgh-painting
  SITE_DIR: pittsburgh-painting

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # build.py reads git history for sitemap lastmod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # dist/ is committed so the deploy needs no build. Rebuilding here only
      # verifies it is current — a stale dist/ means someone edited _src/ and
      # forgot to run build.py, and we would silently ship the old pages.
      # Fail here, with instructions, rather than 40 seconds later inside wrangler.
      - name: Check the Cloudflare secrets are present
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set."
            missing=1
          fi
          if [ -z "$ACCOUNT" ]; then
            echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is not set."
            missing=1
          fi
          if [ "$missing" = "1" ]; then
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Token: Cloudflare -> My Profile -> API Tokens -> Create Token"
            echo "       (Edit Cloudflare Workers template, or Account > Cloudflare Pages > Edit)."
            echo "Account ID: Cloudflare dashboard -> Workers & Pages -> right-hand sidebar."
            echo "Full walkthrough: pittsburgh-painting/README.md -> Deploying to Cloudflare Pages"
            exit 1
          fi
          echo "Both secrets are present."

      - name: Verify dist/ is up to date
        working-directory: ${{ env.SITE_DIR }}
        run: |
          python3 build.py
          # sitemap.xml is excluded: its lastmod comes from git, so it legitimately
          # shifts on the very commit that changes a page. This step rebuilt dist/
          # anyway, so the deploy below always ships a freshly generated sitemap.
          if ! git diff --quiet -- dist/ ':!dist/sitemap.xml'; then
            echo "::error::dist/ is out of date. Run 'python3 build.py' in ${SITE_DIR}/ and commit the result."
            git diff --stat -- dist/ ':!dist/sitemap.xml'
            exit 1
          fi
          echo "dist/ matches the sources."

      - name: Check the deploy surface
        working-directory: ${{ env.SITE_DIR }}
        run: |
          # Nothing private should ever reach the CDN — build.py holds LEAD_EMAIL.
          if find dist -name '*.py' -o -name '_src' -o -name 'CONTENT-CHECKLIST.md' | grep -q .; then
            echo "::error::Private files found inside dist/"; exit 1
          fi
          test -f dist/index.html && test -f dist/404.html
          test -f dist/_headers  && test -f dist/_redirects
          test -f dist/robots.txt && test -f dist/sitemap.xml && test -f dist/llms.txt
          echo "dist/ contains $(( $(find dist -name 'index.html' | wc -l) + 1 )) pages and no private files."

      - name: Create the Pages project if it does not exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create "$PROJECT_NAME" \
            --production-branch=main || true

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ env.SITE_DIR }}
          command: >-
            pages deploy dist
            --project-name=${{ env.PROJECT_NAME }}
            --branch=${{ (github.ref_name == 'main' || inputs.production) && 'main' || github.ref_name }}

      - name: Summary
        run: |
          {
            echo "### Deployed to Cloudflare Pages"
            echo
            echo "- **URL:** ${{ steps.deploy.outputs.deployment-url }}"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            if [ "${{ github.ref_name }}" = "main" ] || [ "${{ inputs.production }}" = "true" ]; then
              echo "- **Environment:** production"
            else
              echo "- **Environment:** preview"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
