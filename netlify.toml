# Netlify build configuration.
#
# With `base` set, every other path here is resolved relative to it — so
# publish = "dist" means pittsburgh-painting/dist.
# https://docs.netlify.com/build/configure-builds/monorepos/

[build]
  base    = "pittsburgh-painting"
  publish = "dist"
  # dist/ is committed, so CI has nothing to build. This keeps Netlify from
  # trying to auto-detect a framework and run something unexpected.
  command = "echo 'dist/ is committed — nothing to build.'"

[build.processing]
  # The output is already tuned: minified-enough CSS/JS, explicit image
  # dimensions, self-hosted fonts. Netlify's post-processing would only risk
  # changing bytes we have already measured.
  skip_processing = true

# Security and cache headers live in dist/_headers, and redirects in
# dist/_redirects — both generated by build.py so they cannot drift from the
# page list, and both read natively by Netlify.
